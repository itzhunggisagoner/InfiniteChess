name = "infinitechess"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Google sign-in: paste your OAuth "Web application" client ID here (see README).
# Leave it empty to turn Google sign-in off (everyone plays as a guest, chat stays locked).
[vars]
GOOGLE_CLIENT_ID = ""

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
